<style>
  :root{
    --bg:#14100D; --surface:#1F1915; --ivory:#EDE6DA; --ivory-dim:#B9AF9F;
    --gold:#C89B3C; --gold-soft:#a9823a; --line:#4A4038;
    --serif:"Fraunces", Georgia, serif; --sans:"Libre Franklin", -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ivory); font-family:var(--sans);
    line-height:1.6; min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  .global-nav { height: 44px; background-color: rgba(0,0,0,.75); display: flex; justify-content: center;
    align-items: center; padding: 0 24px; font-size: 12px; font-weight: 500; border-bottom:1px solid var(--line); }
  .global-nav a { color: var(--ivory); text-decoration:none; font-family:var(--serif); font-weight:500; letter-spacing:.02em; }

  .center-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line); padding:32px; }
  h1{ font-family:var(--serif); font-weight:500; font-size:1.5rem; margin:0 0 4px 0; }
  .sub{ color:var(--ivory-dim); font-size:.85rem; margin-bottom:24px; }
  label{ display:block; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  input{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ivory);
    padding:12px 14px; font-family:var(--sans); font-size:.95rem; margin-bottom:16px;
  }
  input:focus{ outline:2px solid var(--gold); outline-offset:2px; }
  button{
    width:100%; padding:13px; background:var(--gold); color:var(--bg); border:none;
    font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
  }
  button:hover{ background:var(--gold-soft); }
  button:disabled{ opacity:.6; cursor:default; }
  .error{ color:#c2544a; font-size:.85rem; margin:-8px 0 16px 0; display:none; }

  #app{ display:none; width:100%; max-width:640px; margin:0 auto; padding:24px; flex:1; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .toolbar h1{ font-size:1.3rem; }
  .logout{ background:none; border:1px solid var(--line); color:var(--ivory-dim); width:auto; padding:8px 16px; font-size:.7rem; }
  .logout:hover{ background:none; border-color:var(--gold); color:var(--gold); }
  .search-box{ position:relative; margin-bottom:24px; }
  .search-box input{ margin-bottom:0; }
  .list{ display:flex; flex-direction:column; gap:12px; }
  .row{
    background:var(--surface); border:1px solid var(--line); padding:16px 18px;
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .row .info b{ font-family:var(--serif); font-weight:500; font-size:1.05rem; }
  .row .info .meta{ color:var(--ivory-dim); font-size:.82rem; margin-top:2px; }
  .row .actions{ display:flex; gap:8px; }
  .row button{ width:auto; padding:9px 16px; font-size:.7rem; }
  .btn-checkin{ background:var(--gold); color:var(--bg); }
  .btn-checkin.done{ background:var(--line); color:var(--ivory-dim); cursor:default; }
  .empty{ color:var(--ivory-dim); text-align:center; padding:40px 0; font-size:.9rem; }
</style>
</head>
<body>

  <nav class="global-nav">
    <a href="/">FIZZY'S BUTTER CHICKEN</a>
  </nav>

  <!-- LOGIN -->
  <div class="center-wrap" id="loginWrap">
    <div class="card" id="loginCard">
      <h1>Staff Login</h1>
      <p class="sub">Fizzy's Butter Chicken — Reservation Check-In</p>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <p class="error" id="loginError">Login failed. Check your email and password.</p>
      <button id="loginBtn">Log In</button>
    </div>
  </div>

  <!-- CHECK-IN APP -->
  <div id="app">
    <div class="toolbar">
      <h1>Tonight's Reservations</h1>
      <button class="logout" id="logoutBtn">Log Out</button>
    </div>
    <div class="search-box">
      <label for="search">Search guest name</label>
      <input type="text" id="search" placeholder="Start typing a name…">
    </div>
    <div class="list" id="results"></div>
  </div>

<script>
  var supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  var loginWrap = document.getElementById('loginWrap');
  var app = document.getElementById('app');
  var loginError = document.getElementById('loginError');

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  async function loadReservations(query) {
    var resultsEl = document.getElementById('results');
    var req = supabase.from('reservations').select('*').eq('reservation_date', todayStr()).order('reservation_time', { ascending: true });
    if (query) req = req.ilike('name', '%' + query + '%');
    var { data, error } = await req;

    if (error) {
      resultsEl.innerHTML = '<div class="empty">Could not load reservations.</div>';
      return;
    }
    if (!data || data.length === 0) {
      resultsEl.innerHTML = '<div class="empty">No reservations found for today.</div>';
      return;
    }
    resultsEl.innerHTML = data.map(function (r) {
      var checkedIn = r.status === 'checked_in';
      return '<div class="row">' +
        '<div class="info">' +
          '<b>' + escapeHtml(r.name) + '</b>' +
          '<div class="meta">' + escapeHtml(r.reservation_time) + ' · ' + escapeHtml(String(r.guests)) + ' guests · ' + escapeHtml(r.phone || r.email || '') + '</div>' +
        '</div>' +
        '<div class="actions">' +
         '<button class="btn-checkin' + (checkedIn ? ' done' : '') +
'" data-id="' + r.id +
'" data-name="' + escapeHtml(r.name) +
'" data-email="' + escapeHtml(r.email) +
'"' + (checkedIn ? ' disabled' : '') + '>' +
          (checkedIn ? 'Checked In' : 'Check In') +
         '</button>' +
        '</div>' +
      '</div>';
    }).join('');

    resultsEl.querySelectorAll('.btn-checkin:not(.done)').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        btn.textContent = 'Sending...';

        var { error } = await supabase
          .from('reservations')
          .update({ status: 'checked_in' })
          .eq('id', btn.dataset.id);

        if (error) {
          btn.disabled = false;
          btn.textContent = 'Check In';
          alert(error.message);
          return;
        }

        await sendReservationEmail(btn.dataset.name, btn.dataset.email);

        btn.textContent = 'Checked In';
        btn.classList.add('done');
      });
    });
  }

  async function sendReservationEmail(name, email) {
    try {
      await fetch("/api/send-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, email: email })
      });
      console.log("Email Sent");
    } catch (err) {
      console.error(err);
    }
  }

  async function checkSession() {
    var { data } = await supabase.auth.getSession();
    if (data.session) {
      loginWrap.style.display = 'none';
      app.style.display = 'block';
      loadReservations('');
    } else {
      loginWrap.style.display = 'flex';
      app.style.display = 'none';
    }
  }

  document.getElementById('loginBtn').addEventListener('click', async function () {
    loginError.style.display = 'none';
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    var { error } = await supabase.auth.signInWithPassword({ email: email, password: password });
    if (error) { loginError.style.display = 'block'; return; }
    checkSession();
  });

  document.getElementById('logoutBtn').addEventListener('click', async function () {
    await supabase.auth.signOut();
    checkSession();
  });

  document.getElementById('search').addEventListener('input', function (e) {
    loadReservations(e.target.value.trim());
  });

  checkSession();
</script>
</body>
</html>
