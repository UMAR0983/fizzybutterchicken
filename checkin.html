<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root{
    --bg:#14100D; --surface:#1F1915; --ivory:#EDE6DA; --ivory-dim:#B9AF9F;
    --gold:#C89B3C; --gold-soft:#a9823a; --line:#4A4038; --green:#8fae6b;
    --serif:"Fraunces", Georgia, serif; --sans:"Libre Franklin", -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ivory); font-family:var(--sans);
    line-height:1.6; min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  .global-nav { height: 44px; background-color: rgba(0,0,0,.75); display: flex; justify-content: space-between;
    align-items: center; padding: 0 24px; font-size: 12px; font-weight: 500; border-bottom:1px solid var(--line); }
  .global-nav a { color: var(--ivory); text-decoration:none; font-family:var(--serif); font-weight:500; letter-spacing:.02em; }

  .center-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); padding:32px; border-radius:4px; }
  h1{ font-family:var(--serif); font-weight:500; font-size:1.5rem; margin:0 0 4px 0; }
  .sub{ color:var(--ivory-dim); font-size:.85rem; margin-bottom:24px; }
  label{ display:block; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  input{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ivory);
    padding:12px 14px; font-family:var(--sans); font-size:.95rem; margin-bottom:16px; border-radius:2px;
  }
  input:focus{ outline:2px solid var(--gold); outline-offset:2px; }
  button{
    width:100%; padding:13px; background:var(--gold); color:var(--bg); border:none;
    font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; font-weight:600; border-radius:2px;
  }
  button:hover{ background:var(--gold-soft); }
  button:disabled{ opacity:.6; cursor:default; }
  .error{ color:#c2544a; font-size:.85rem; margin:-8px 0 16px 0; display:none; }

  #app{ display:none; width:100%; max-width:680px; margin:0 auto; padding:24px; flex:1; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .toolbar h1{ font-size:1.4rem; margin:0; }
  .logout{ background:none; border:1px solid var(--line); color:var(--ivory-dim); width:auto; padding:8px 16px; font-size:.7rem; }
  .logout:hover{ background:none; border-color:var(--gold); color:var(--gold); }
  
  .filter-tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{ background:var(--surface); border:1px solid var(--line); color:var(--ivory-dim); padding:8px 16px; font-size:.75rem; width:auto; text-transform:none; letter-spacing:0; }
  .tab-btn.active{ background:var(--gold); color:var(--bg); border-color:var(--gold); }

  .search-box{ position:relative; margin-bottom:20px; }
  .search-box input{ margin-bottom:0; }
  .list{ display:flex; flex-direction:column; gap:12px; }
  .empty{ background:var(--surface); border:1px dashed var(--line); padding:32px; text-align:center; color:var(--ivory-dim); font-size:.9rem; }
  
  .row{
    background:var(--surface); border:1px solid var(--line); padding:18px 20px;
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; border-radius:3px;
  }
  .row .info b{ font-family:var(--serif); font-weight:500; font-size:1.1rem; }
  .row .info .meta{ color:var(--ivory-dim); font-size:.84rem; margin-top:4px; }
  .row .info .id-badge{ font-family:monospace; font-size:.75rem; color:var(--gold); margin-right:8px; }
  .row .actions{ display:flex; gap:8px; }
  .row button{ width:auto; padding:10px 18px; font-size:.72rem; }
  .btn-checkin{ background:var(--gold); color:var(--bg); }
  .btn-checkin.done{ background:rgba(143,174,107,.15); color:var(--green); border:1px solid var(--green); cursor:default; }
</style>
</head>
<body>

  <nav class="global-nav">
    <a href="/">FIZZY'S BUTTER CHICKEN</a>
    <a href="/admin">Admin Console</a>
  </nav>

  <!-- LOGIN -->
  <div class="center-wrap" id="loginWrap">
    <div class="card" id="loginCard">
      <h1>Staff Check-In</h1>
      <p class="sub">Enter staff passcode or credentials to manage check-ins</p>
      <label for="password">Passcode or Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Passcode (e.g. admin123)" onkeydown="if(event.key === 'Enter') doLogin()">
      <p class="error" id="loginError">Invalid passcode. Please try again.</p>
      <button id="loginBtn" onclick="doLogin()">Log In</button>
    </div>
  </div>

  <!-- CHECK-IN APP -->
  <div id="app">
    <div class="toolbar">
      <h1>Staff Check-In Portal</h1>
      <button class="logout" id="logoutBtn" onclick="doLogout()">Log Out</button>
    </div>

    <div class="filter-tabs">
      <button class="tab-btn active" id="tabToday" onclick="setFilter('today')">Today's Reservations</button>
      <button class="tab-btn" id="tabAll" onclick="setFilter('all')">All Reservations</button>
    </div>

    <div class="search-box">
      <label for="search">Search guest name, ID, or phone</label>
      <input type="text" id="search" placeholder="Type name, ID (e.g. RES-123), or phone…" oninput="onSearchInput()">
    </div>

    <div class="list" id="results"></div>
  </div>

<script>
  var supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  var activeFilter = 'today';

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function checkSession() {
    var isAuth = sessionStorage.getItem('staff_auth') === 'true' || localStorage.getItem('staff_auth') === 'true';
    if (isAuth) {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadReservations();
    } else {
      document.getElementById('loginWrap').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  }

  async function doLogin() {
    var loginError = document.getElementById('loginError');
    loginError.style.display = 'none';
    var pass = document.getElementById('password').value.trim();

    if (pass === 'admin123' || pass === 'staff123' || pass === 'admin123secret' || pass === 'admin') {
      sessionStorage.setItem('staff_auth', 'true');
      checkSession();
      return;
    }

    // Try Supabase Auth as secondary option
    try {
      var { data, error } = await supabase.auth.signInWithPassword({ email: pass, password: pass });
      if (!error && data.session) {
        sessionStorage.setItem('staff_auth', 'true');
        checkSession();
        return;
      }
    } catch (e) {}

    loginError.style.display = 'block';
  }

  function doLogout() {
    sessionStorage.removeItem('staff_auth');
    localStorage.removeItem('staff_auth');
    supabase.auth.signOut();
    checkSession();
  }

  function setFilter(filter) {
    activeFilter = filter;
    document.getElementById('tabToday').classList.toggle('active', filter === 'today');
    document.getElementById('tabAll').classList.toggle('active', filter === 'all');
    loadReservations();
  }

  function onSearchInput() {
    loadReservations();
  }

  async function loadReservations() {
    var resultsEl = document.getElementById('results');
    var query = document.getElementById('search').value.trim();

    resultsEl.innerHTML = '<div class="empty">Loading reservations…</div>';

    var req = supabase.from('reservations').select('*').order('created_at', { ascending: false });

    if (activeFilter === 'today' && !query) {
      req = req.eq('reservation_date', todayStr());
    }

    var { data, error } = await req;

    if (error) {
      resultsEl.innerHTML = '<div class="empty">Could not load reservations: ' + escapeHtml(error.message) + '</div>';
      return;
    }

    if (query) {
      var q = query.toLowerCase();
      data = (data || []).filter(function(r) {
        return (r.name || '').toLowerCase().includes(q) ||
               (r.id || '').toLowerCase().includes(q) ||
               (r.phone || '').toLowerCase().includes(q) ||
               (r.email || '').toLowerCase().includes(q);
      });
    }

    if (!data || data.length === 0) {
      resultsEl.innerHTML = '<div class="empty">' + (query ? 'No matching reservations found.' : 'No reservations found for today.') + '</div>';
      return;
    }

    resultsEl.innerHTML = data.map(function (r) {
      var checkedIn = r.status === 'checked_in';
      return '<div class="row">' +
        '<div class="info">' +
          '<div><span class="id-badge">' + escapeHtml(r.id) + '</span><b>' + escapeHtml(r.name) + '</b></div>' +
          '<div class="meta">' + escapeHtml(r.reservation_date || '') + ' at ' + escapeHtml(r.reservation_time || '') + ' · ' + escapeHtml(String(r.guests || 1)) + ' guest(s) · ' + escapeHtml(r.phone || r.email || '') + '</div>' +
        '</div>' +
        '<div class="actions">' +
         '<button class="btn-checkin' + (checkedIn ? ' done' : '') +
          '" data-id="' + r.id +
          '" data-name="' + escapeHtml(r.name) +
          '" data-email="' + escapeHtml(r.email) +
          '"' + (checkedIn ? ' disabled' : '') + '>' +
          (checkedIn ? '✓ Checked In' : 'Check In') +
         '</button>' +
        '</div>' +
      '</div>';
    }).join('');

    resultsEl.querySelectorAll('.btn-checkin:not(.done)').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        btn.textContent = 'Processing…';

        var { error } = await supabase
          .from('reservations')
          .update({ status: 'checked_in' })
          .eq('id', btn.dataset.id);

        if (error) {
          btn.disabled = false;
          btn.textContent = 'Check In';
          alert('Check-in error: ' + error.message);
          return;
        }

        // Send checkin email
        await sendCheckinEmail(btn.dataset.name, btn.dataset.email);

        btn.textContent = '✓ Checked In';
        btn.classList.add('done');
      });
    });
  }

  async function sendCheckinEmail(name, email) {
    if (!email) return;
    try {
      await fetch("/api/send-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, email: email, type: 'checkin' })
      });
    } catch (err) {
      console.warn('Checkin email trigger error:', err);
    }
  }

  checkSession();
</script>
</body>
</html>
